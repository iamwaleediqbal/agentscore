[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentscore"
version = "0.1.0"
description = "A small, honest evaluation harness for LLMs. Deterministic first, judged only when it has to be, and never a single run."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Waleed Iqbal" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  # Swap for "polyact>=0.1.0" once it is published to PyPI.
  "polyact @ git+https://github.com/iamwaleediqbal/polyact.git",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
agentscore = "agentscore.cli:main"

[tool.hatch.metadata]
# polyact is depended on by git URL until it is published to PyPI, and
# hatchling refuses a direct reference unless this is set. Note that PyPI
# rejects direct references too, so publishing agentscore means switching that
# dependency to a normal version spec first.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Selected explicitly rather than inheriting ruff's defaults. Ruff changes its
# default rule set between minor versions, so a config that leans on those
# defaults turns a green badge red on a repo nobody has touched. E4/E7/E9 plus
# F is ruff's own long-standing core; I adds import ordering.
select = ["E4", "E7", "E9", "F", "I"]
