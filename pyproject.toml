[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentscore"
version = "0.1.0"
description = "A small, honest evaluation harness for LLMs. Deterministic first, judged only when it has to be, and never a single run."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Waleed Iqbal" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  # Swap for "polyact>=0.1.0" once it is published to PyPI.
  "polyact @ git+https://github.com/iamwaleediqbal/polyact.git",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
agentscore = "agentscore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
